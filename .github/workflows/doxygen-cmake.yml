name: Generate and Deploy Doxygen Docs

on:
  push:
    branches: [main, docu]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Generate default Doxyfile
        run: doxygen -g Doxyfile

      - name: Configure Doxyfile for .dox files
        run: |
          sed -i 's|^INPUT .*|INPUT = ./|' Doxyfile
          sed -i 's|^RECURSIVE .*|RECURSIVE = YES|' Doxyfile
          sed -i 's|^FILE_PATTERNS .*|FILE_PATTERNS = *.dox|' Doxyfile
          sed -i 's|^OUTPUT_DIRECTORY .*|OUTPUT_DIRECTORY = docs_output|' Doxyfile
          sed -i 's|^GENERATE_LATEX .*|GENERATE_LATEX = NO|' Doxyfile

      - name: Run Doxygen
        run: doxygen Doxyfile

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs_output/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
