name: Generate and Deploy Doxygen Docs

on:
  push:
    branches: [ main, docu ]
  workflow_dispatch:

jobs:
  doxygen-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Generate default Doxyfile
        run: doxygen -g Doxyfile

      - name: Configure Doxyfile for .dox files
        run: |
          sed -i 's|^INPUT .*|INPUT = ./|' Doxyfile
          sed -i 's|^RECURSIVE .*|RECURSIVE = YES|' Doxyfile
          sed -i 's|^FILE_PATTERNS .*|FILE_PATTERNS = *.dox|' Doxyfile
          sed -i 's|^OUTPUT_DIRECTORY .*|OUTPUT_DIRECTORY = docs_output|' Doxyfile
          sed -i 's|^GENERATE_LATEX .*|GENERATE_LATEX = NO|' Doxyfile

      - name: Run Doxygen
        run: doxygen Doxyfile

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs_output/html
          publish_branch: gh-pages
          destination_dir: ${{ github.ref_name }}  # publishes to /main/ or /docu/ etc.
